# Inventaire des routeurs MikroTik interroges par le controleur.
# Copier en config/routers.yml (ignore par git) et adapter.
#
# CE FICHIER EST OPTIONNEL. Les PoPs peuvent aussi etre ajoutes depuis
# l'interface (onglet PoPs), auquel cas ils vivent en base avec leur mot de
# passe chiffre. En cas d'homonymie, ce fichier a la priorite : une declaration
# versionnee et revue prime sur une saisie au clavier.
#
# SECURITE : jamais de mot de passe ici. On declare le NOM d'une variable
# d'environnement (password_env) qui porte le secret.

routers:
  # --- Modele a dupliquer -------------------------------------------------
  - name: pop-1                # identifiant unique, sert de cle aux metriques
    host: 10.10.0.11           # adresse de management
    port: 8728                 # 8728 = API binaire, 8729 = api-ssl
    username: qos-ro           # groupe avec policy=read,api,test
    password_env: MT_POP_1_PASSWORD
    role: pop                  # pop | core | gateway
    pop_name: Site 1           # libelle affiche dans l'interface
    enabled: true
    timeout_s: 5.0

    # RouterOS nomme l'interface dynamique d'une session PPPoE <pppoe-LOGIN>.
    # C'est elle qui porte les compteurs d'octets. A adapter si le profil PPP
    # utilise un autre nommage.
    pppoe_interface_pattern: "<pppoe-{login}>"

    # OPTIONNEL. Compte d'ecriture distinct, si vous separez les privileges.
    # Sans lui, le compte ci-dessus est utilise pour l'enforcement : ce sont ses
    # droits REELS sur le routeur qui decident, pas cette declaration.
    # Mettez REQUIRE_SEPARATE_WRITE_ACCOUNT=true pour rendre la separation
    # obligatoire.
    # rw_username: qos-rw
    # rw_password_env: MT_POP_1_RW_PASSWORD

# Backhauls radio. LECTURE SEULE : on ne pilote jamais la radio, on lit sa
# capacite pour en faire le debit parent du shaping.
backhauls:
  - name: bh-1
    pop_name: Site 1           # doit correspondre au pop_name ci-dessus
    uisp_device_id: 00000000-0000-0000-0000-000000000000
    nominal_capacity_mbps: 500
