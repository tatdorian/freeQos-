name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Les tests unitaires ne demandent aucune infrastructure. Ce service ne sert
    # qu'aux tests d'integration, seuls capables de valider le chemin propre a
    # TimescaleDB : hypertables, compression, politiques de retention.
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: qos
          POSTGRES_PASSWORD: qos
          POSTGRES_DB: qos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qos -d qos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Format
        run: ruff format --check app tests

      - name: Tests unitaires (sans infrastructure)
        run: pytest -q

      - name: Tests d'integration (TimescaleDB reel)
        env:
          TEST_DATABASE_URL: postgresql://qos:qos@localhost:5432/qos_test
        run: pytest tests/test_db_integration.py -q

      - name: Verifier que les hypertables ont bien ete creees
        env:
          PGPASSWORD: qos
        run: |
          psql -h localhost -U qos -d qos_test -tAc \
            "SELECT hypertable_name FROM timescaledb_information.hypertables ORDER BY 1" \
            | tee /tmp/hypertables.txt
          grep -qx backhaul_metrics   /tmp/hypertables.txt
          grep -qx qoe_scores         /tmp/hypertables.txt
          grep -qx subscriber_metrics /tmp/hypertables.txt
          echo "Politiques de fond :"
          psql -h localhost -U qos -d qos_test -tAc \
            "SELECT proc_name, hypertable_name FROM timescaledb_information.jobs
              WHERE hypertable_name IS NOT NULL ORDER BY 1, 2"
