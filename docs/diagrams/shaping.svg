<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="Limiting slightly below capacity moves the queue to where it is well managed">
  <defs>
    <marker id="sh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="d-mark" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <text class="d-title" x="24" y="34">Limiting slightly below capacity moves the queue to where it is well managed</text>
  <text class="d-name" x="40" y="72">Without freeQoS</text>
  <text class="d-name" x="412" y="72">With freeQoS</text>
  <g class="d-conn">
    <path d="M194 164V196" marker-end="url(#sh-arrow)"/>
    <path d="M194 268V300" marker-end="url(#sh-arrow)"/>
    <path d="M194 372V404" marker-end="url(#sh-arrow)"/>
    <path d="M566 164V196" marker-end="url(#sh-arrow)"/>
    <path d="M566 268V300" marker-end="url(#sh-arrow)"/>
    <path d="M566 372V404" marker-end="url(#sh-arrow)"/>
  </g>
  <rect class="d-box" x="40" y="92" width="308" height="72" rx="8"/>
  <text class="d-name" x="56" y="116">Internet</text>
  <text class="d-line" x="56" y="132">traffic arrives faster</text>
  <text class="d-line" x="56" y="148">than the radio can transmit it</text>
  <rect class="d-box" x="40" y="196" width="308" height="72" rx="8"/>
  <text class="d-name" x="56" y="220">PoP router</text>
  <text class="d-line" x="56" y="236">no limit:</text>
  <text class="d-line" x="56" y="252">everything goes on to the radio</text>
  <rect class="d-bad" x="40" y="300" width="308" height="72" rx="8"/>
  <text class="d-name" x="56" y="324">Sector radio</text>
  <text class="d-line-strong" x="56" y="340">buffer full: the queue forms here</text>
  <text class="d-line-strong" x="56" y="356">latency rises for the whole sector</text>
  <rect class="d-box" x="40" y="404" width="308" height="72" rx="8"/>
  <text class="d-name" x="56" y="428">Subscribers</text>
  <text class="d-line" x="56" y="444">the video call waits behind</text>
  <text class="d-line" x="56" y="460">the neighbours' downloads</text>
  <rect class="d-box" x="412" y="92" width="308" height="72" rx="8"/>
  <text class="d-name" x="428" y="116">Internet</text>
  <text class="d-line" x="428" y="132">the same traffic,</text>
  <text class="d-line" x="428" y="148">at the same speed</text>
  <rect class="d-accent" x="412" y="196" width="308" height="72" rx="8"/>
  <text class="d-name" x="428" y="220">PoP router and CAKE queue</text>
  <text class="d-line-strong" x="428" y="236">limit at 90% of the radio capacity</text>
  <text class="d-line-strong" x="428" y="252">the queue forms here, short and shared</text>
  <rect class="d-box" x="412" y="300" width="308" height="72" rx="8"/>
  <text class="d-name" x="428" y="324">Sector radio</text>
  <text class="d-line" x="428" y="340">never saturated:</text>
  <text class="d-line" x="428" y="356">its buffer stays empty</text>
  <rect class="d-box" x="412" y="404" width="308" height="72" rx="8"/>
  <text class="d-name" x="428" y="428">Subscribers</text>
  <text class="d-line" x="428" y="444">each flow gets its share: a download</text>
  <text class="d-line" x="428" y="460">no longer delays the neighbour's call</text>
</svg>
