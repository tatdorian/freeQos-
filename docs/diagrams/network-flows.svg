<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Only one connection arrives without a reply: the routers' NetFlow">
  <defs>
    <marker id="fx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="d-mark" d="M0 0L10 5L0 10z"/></marker>
    <marker id="fx-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="d-mark-accent" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <text class="d-title" x="24" y="30">Only one connection arrives without a reply: the routers' NetFlow</text>
  <text class="d-line" x="24" y="52">The arrow starts from whoever opens the connection; the reply comes back over the same connection.</text>
  <g class="d-conn">
    <path d="M194 124H290" marker-end="url(#fx-arrow)"/>
    <path d="M194 220H290" marker-end="url(#fx-arrow)"/>
    <path d="M490 112H586" marker-end="url(#fx-arrow)"/>
    <path d="M490 176H586" marker-end="url(#fx-arrow)"/>
    <path d="M490 240H586" marker-end="url(#fx-arrow)"/>
    <path d="M350 264V352" marker-end="url(#fx-arrow)"/>
    <path d="M490 388H586" marker-end="url(#fx-arrow)"/>
  </g>
  <path class="d-write" d="M430 352V264" marker-end="url(#fx-accent)"/>
  <text class="d-name-sm" x="440" y="302">UDP 2055</text>
  <text class="d-line-strong" x="440" y="318">no reply</text>
  <text class="d-line" x="242" y="116" text-anchor="middle">TCP 8000 / 443</text>
  <text class="d-line" x="242" y="212" text-anchor="middle">TCP 8000 / 443</text>
  <text class="d-line" x="538" y="104" text-anchor="middle">HTTPS 443</text>
  <text class="d-line" x="538" y="168" text-anchor="middle">UDP/TCP 53</text>
  <text class="d-line" x="538" y="232" text-anchor="middle">HTTPS 443</text>
  <text class="d-name-sm" x="342" y="302" text-anchor="end">TCP 8728 / 8729</text>
  <text class="d-line" x="342" y="318" text-anchor="end">reads, writes, ping orders</text>
  <text class="d-line" x="538" y="380" text-anchor="middle">ICMP echo</text>
  <rect class="d-box" x="24" y="96" width="170" height="56" rx="8"/>
  <text class="d-name" x="40" y="120">Operators</text>
  <text class="d-line" x="40" y="138">web browser</text>
  <rect class="d-box" x="24" y="192" width="170" height="56" rx="8"/>
  <text class="d-name" x="40" y="216">Billing, CRM</text>
  <text class="d-line" x="40" y="234">API calls, with a key</text>
  <rect class="d-accent" x="290" y="80" width="200" height="184" rx="8"/>
  <text class="d-name" x="306" y="104">freeQoS server</text>
  <text class="d-line-strong" x="306" y="124">application</text>
  <text class="d-line-strong" x="306" y="140">listens on TCP 8000, UDP 2055</text>
  <text class="d-line-strong" x="306" y="164">TimescaleDB database</text>
  <text class="d-line-strong" x="306" y="180">TCP 5432, internal Docker</text>
  <text class="d-line-strong" x="306" y="196">network, never published</text>
  <rect class="d-box" x="586" y="88" width="150" height="48" rx="8"/>
  <text class="d-name" x="600" y="108">UISP, airOS</text>
  <text class="d-line" x="600" y="126">radio capacity</text>
  <rect class="d-box" x="586" y="152" width="150" height="48" rx="8"/>
  <text class="d-name" x="600" y="172">DNS resolver</text>
  <text class="d-line" x="600" y="190">reverse names</text>
  <rect class="d-box" x="586" y="216" width="150" height="48" rx="8"/>
  <text class="d-name" x="600" y="236">RDAP, geoloc</text>
  <text class="d-line" x="600" y="254">can be disabled</text>
  <rect class="d-box" x="290" y="352" width="200" height="64" rx="8"/>
  <text class="d-name" x="306" y="378">MikroTik routers</text>
  <text class="d-line" x="306" y="398">PoP, core, gateway</text>
  <rect class="d-box" x="586" y="360" width="150" height="56" rx="8"/>
  <text class="d-name" x="600" y="384">Subscribers (CPE)</text>
  <text class="d-line" x="600" y="402">answer the ping</text>
</svg>
